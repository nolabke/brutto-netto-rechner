<title>Brutto-Netto-Rechner 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-sans/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-mono/style.css"><style>
/* Layout: Eingabespalte links, Ergebnis rechts; Abzugsliste wie eine Lohnabrechnung, darunter Vergleich und Kurve */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#14212B; --muted:#586977; --line:#D6DDE4; --soft:#F4F6F8;
  --accent:#0b1b78c0; --accent-ink:#FFFFFF; --focus:#0b6d78ea;
  --c-net:#0b1b78c0; --c-tax:#c21256b2; --c-rv:#d04f2fa9; --c-kv:#6ac44fda; --c-av:#6a7b89d0;
  --font-sans: "Geist Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#161F27; --ink:#E7EDF2; --muted:#96A7B4; --line:#293641; --soft:#1B2630;
    --accent:#3DB8C3; --accent-ink:#06191C; --focus:#3DB8C3;
    --c-net:#3DB8C3; --c-tax:#E9953D; --c-rv:#6D93F0; --c-kv:#B484E6; --c-av:#8FA0AE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#161F27; --ink:#E7EDF2; --muted:#96A7B4; --line:#293641; --soft:#1B2630;
  --accent:#3DB8C3; --accent-ink:#06191C; --focus:#3DB8C3;
  --c-net:#3DB8C3; --c-tax:#E9953D; --c-rv:#6D93F0; --c-kv:#B484E6; --c-av:#8FA0AE;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:clamp(1.5rem,1.1rem + 1.6vw,2.1rem);line-height:1.15;margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.lede{font-size:1.2rem; margin:6px 0 0;color:var(--muted);max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
label,.lbl{display:block;font-size:.78rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.field{display:flex;flex-direction:column;margin-bottom:16px}
.field:last-child{margin-bottom:0}
input[type=number],select{width:100%;font:inherit;font-family:var(--font-mono);color:var(--ink);background:var(--soft);
  border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-height:42px}
select{font-family:var(--font-sans)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--soft)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;padding:8px 6px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--muted)}
.seg input:checked + label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + label{outline:2px solid var(--focus);outline-offset:-2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;margin:0}
.check input{margin-top:3px;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}

.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.net{font-family:var(--font-mono);font-weight:500;font-size:clamp(2.1rem,1.4rem + 3vw,3.1rem);line-height:1.05;letter-spacing:-.02em;color:var(--accent)}
.net small{font-size:.9rem;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:6px;font-family:var(--font-sans)}
.facts{color:var(--muted);font-size:.9rem}
.facts b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-weight:500}
.bar{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:18px 0 10px;background:var(--soft)}
.bar span{display:block;height:100%;min-width:0}
.bar span + span{border-left:2px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.notice{margin:14px 0 0;padding:10px 12px;background:var(--soft);border-radius:4px;font-size:.86rem;color:var(--muted)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.n,td.p{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td.p{color:var(--muted)}
tr.sum td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
tr.sum td.n{color:var(--accent)}
tr.ag td{color:var(--muted)}
tr.cur td{background:var(--soft)}
tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px}
.small{font-size:.84rem;color:var(--muted);margin:10px 0 0}

.chartbox{overflow-x:auto}
svg.chart{display:block;width:100%;min-width:520px;height:auto}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .gl{stroke:var(--line);stroke-width:1;opacity:.6}
.chart .tx{fill:var(--muted);font-size:11px;font-family:var(--font-sans)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round}
.chart .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.chart .cur{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-mono)}

ul.notes{margin:0;padding-left:1.1em;color:var(--muted);font-size:.86rem;display:flex;flex-direction:column;gap:6px}
ul.notes a{color:var(--accent)}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.card{padding:16px}}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .25s ease}}
